<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zenov Conveyance Management — Login</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='pdf.ico') }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div class="login-page">
    <div class="login-card card">
      <div class="login-header">
        <img src="{{ url_for('static', filename='Zenov_Logo_BG.png') }}" alt="Zenov" width="55" height="55" />
        <h1>Zenov Conveyance Management</h1>
        <p class="subtitle">Sign in to continue</p>
      </div>

      {% if error %}
      <div class="alert">{{ error }}</div>
      {% endif %}

      <form method="POST" action="{{ url_for('login') }}" class="login-form">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required autofocus autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary login-btn">Sign In</button>
      </form>
    </div>
  </div>
</body>
</html>
