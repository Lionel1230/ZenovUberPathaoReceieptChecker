<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Analyzer — Login</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='pdf.ico') }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div class="login-page">
    <div class="login-card card">
      <div class="login-header">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M14 2v6h6" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M9 13h6M9 17h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <h1>PDF Analyzer</h1>
        <p class="subtitle">Sign in to continue</p>
      </div>

      {% if error %}
      <div class="alert">{{ error }}</div>
      {% endif %}

      <form method="POST" action="{{ url_for('login') }}" class="login-form">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required autofocus autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary login-btn">Sign In</button>
      </form>
    </div>
  </div>
</body>
</html>
