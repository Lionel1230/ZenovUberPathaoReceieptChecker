<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zenov Conveyance Management — Login</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='pdf.ico') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div class="login-page">
    <div class="maintenance-banner hidden" id="maintenanceBanner">
      <span id="maintenanceText"></span>
    </div>

    <div class="card login-card">
      <div class="card-content">
        <div class="login-header">
          <img src="{{ url_for('static', filename='Zenov_Logo_BG.png') }}" alt="Zenov" />
          <h1>Zenov Conveyance Management</h1>
          <span class="badge badge-default">BETA</span>
          <p class="text-sm text-muted" style="margin-top:0.5rem">Sign in to continue</p>
        </div>

        {% if error %}
        <div class="alert alert-error" role="alert">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}" class="login-form">
          <div class="field">
            <label class="label" for="username">Username</label>
            <input class="input" type="text" id="username" name="username" required autofocus autocomplete="username" />
          </div>
          <div class="field">
            <label class="label" for="password">Password</label>
            <input class="input" type="password" id="password" name="password" required autocomplete="current-password" />
          </div>
          <button type="submit" class="btn btn-default btn-full">Sign In</button>
        </form>

        <div class="login-footer">
          <a href="{{ url_for('register_request_page') }}" class="btn btn-outline btn-full" style="margin-top:0.5rem">Create Account</a>
        </div>
        <div style="display:flex;gap:0.5rem;margin-top:0.75rem">
          <a href="{{ url_for('demo_login', role='admin') }}" class="btn btn-secondary btn-full">Demo Admin</a>
          <a href="{{ url_for('demo_login', role='user') }}" class="btn btn-secondary btn-full">Demo User</a>
        </div>
      </div>
    </div>

    <footer class="footer">
      <p class="daily-quote hidden" id="dailyQuote"></p>
      <p class="credit">Designed by <strong class="credit-name">Julker Naine Jakaria</strong></p>
    </footer>
  </div>

  <script>
    fetch("/api/site-config").then(function(r){ return r.ok ? r.json() : null }).then(function(d){
      if(!d) return;
      if(d.daily_quote){
        var el = document.getElementById("dailyQuote");
        el.textContent = "\u201C" + d.daily_quote + "\u201D";
        el.classList.remove("hidden");
      }
      if(d.maintenance_message){
        var b = document.getElementById("maintenanceBanner");
        document.getElementById("maintenanceText").textContent = d.maintenance_message;
        b.classList.remove("hidden");
      }
    }).catch(function(){});
  </script>
</body>
</html>
